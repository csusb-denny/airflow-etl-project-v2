services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Creates the airflow (metadata) and warehouse DBs if missing
  db-init:
    image: postgres:15
    depends_on:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
    command:
      - bash
      - -lc
      - |
        set -e
        until pg_isready -h postgres -p ${POSTGRES_PORT} -U ${POSTGRES_USER}; do sleep 1; done
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='${AIRFLOW_DB_NAME}'" | grep -q 1 \
          || PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d postgres -c "CREATE DATABASE ${AIRFLOW_DB_NAME} OWNER ${POSTGRES_USER};"
        PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='${POSTGRES_DB}'" | grep -q 1 \
          || PGPASSWORD=${POSTGRES_PASSWORD} psql -h postgres -U ${POSTGRES_USER} -d postgres -c "CREATE DATABASE ${POSTGRES_DB} OWNER ${POSTGRES_USER};"
    restart: "no"

  airflow-init:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
      - db-init
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${AIRFLOW_DB_NAME}
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./includes:/opt/airflow/includes
      - ./requirements.txt:/requirements.txt
    command:
      - bash
      - -lc
      - |
        set -e
        pip install -r /requirements.txt
        airflow db init
        airflow users create --role Admin --username admin --password admin --firstname Admin --lastname User --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
      - airflow-init
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${AIRFLOW_DB_NAME}
      # Let the DAG access warehouse DB via env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      WEATHER_LAT: ${WEATHER_LAT}
      WEATHER_LON: ${WEATHER_LON}
      FINANCE_SYMBOL: ${FINANCE_SYMBOL}
      FINANCE_API_KEY: ${FINANCE_API_KEY}
    command: scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./includes:/opt/airflow/includes
    restart: always

  airflow-webserver:
    image: apache/airflow:2.10.2
    depends_on:
      - postgres
      - airflow-init
      - airflow-scheduler
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      WEATHER_LAT: ${WEATHER_LAT}
      WEATHER_LON: ${WEATHER_LON}
      FINANCE_SYMBOL: ${FINANCE_SYMBOL}
      FINANCE_API_KEY: ${FINANCE_API_KEY}
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./includes:/opt/airflow/includes
    restart: always

volumes:
  pgdata:
